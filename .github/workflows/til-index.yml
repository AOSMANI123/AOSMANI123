name: Rebuild TIL index

on:
  push:
    branches: [main]
    paths: ["til/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so entry dates come from first commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index
        run: python3 til/build_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Index unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add til/README.md
            git commit -m "Rebuild TIL index"
            git push
          fi
